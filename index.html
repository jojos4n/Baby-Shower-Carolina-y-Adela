<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación & Bingo Gemelos 🧸🧸</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-dark: #4a4a4a;
            --accent-neutral: #8c9d83;
            --accent-warm: #d0b8ac;
            --border-color: #e2ddd5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding: 15px 10px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .canva-container {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
        }

        .bingo-section-title {
            text-align: center;
            color: #3b4e43;
            margin-bottom: 10px;
            font-size: 1.4rem;
        }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .bingo-card { background: #fbf9f5; border: 2px solid var(--border-color); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; min-height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bingo-card:hover:not(.locked) { border-color: var(--accent-neutral); transform: translateY(-2px); }
        .bingo-card .num { background: #4a5d4e; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 5px; }
        .bingo-card.selected { border-color: var(--accent-neutral); background-color: #eaf1ec; }
        .bingo-card.locked { background-color: #eee9e0; border-color: #ccc; cursor: not-allowed; }
        .bingo-card.locked .num { background: #8c857b; }

        .form-section { background: #f4efe6; border-radius: 12px; padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 25px; }
        .form-section input { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; flex: 1; min-width: 140px; }
        .btn-submit { background: var(--accent-neutral); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; font-size: 1rem; }
        .btn-submit:disabled { background: #ccc; }

        /* SECCIÓN ADMINISTRADOR DENTRO DEL CONTENEDOR */
        .admin-section {
            border-top: 2px dashed var(--border-color);
            padding-top: 20px;
            margin-top: 20px;
            text-align: center;
        }
        .btn-admin-toggle {
            background: #3b4e43;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }
        .admin-panel { display: none; background: #faf8f5; border-radius: 12px; padding: 15px; border: 1px solid var(--border-color); margin-top: 15px; text-align: left; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .admin-table th { background: #f4efe6; color: #3b4e43; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: 0.3s; z-index: 1000; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; width: 90%; text-align: center; }
        .modal-box h3 { color: #3b4e43; margin-bottom: 10px; }
        .modal-box button { background: var(--accent-neutral); color: white; border: none; padding: 8px 16px; border-radius: 6px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">

    <!-- TARJETA CANVA EMBED -->
    <div class="canva-container">
        <div style="position: relative; width: 100%; height: 0; padding-top: 140.9524%; padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); overflow: hidden; border-radius: 8px;">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0; margin: 0;"
              src="https://www.canva.com/design/DAHQtH13JZ4/ZJlbWeLlUDXbXEjV24dcUA/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>
    </div>

    <h2 class="bingo-section-title">🎁 Bingo de Regalos 🧸🧸</h2>
    <p style="text-align: center; margin-bottom: 15px; font-size: 0.9rem; color: #666;">
        Selecciona un número disponible para inscribirte y descubrir qué regalo te tocó (todas las casillas tienen regalos con precios parecidos 😉).
    </p>

    <div class="grid-container" id="bingoGrid"></div>

    <div class="form-section">
        <strong id="selectedCardText" style="width: 100%; text-align: center;">1. Selecciona un número arriba</strong>
        <input type="text" id="inputName" placeholder="Tu Nombre completo" disabled>
        <input type="tel" id="inputPhone" placeholder="Tu Teléfono Celular" disabled>
        <button class="btn-submit" id="btnRegister" disabled onclick="registerCard()">Confirmar e Inscribirme</button>
    </div>

    <!-- BOTÓN Y PANEL DE ADMINISTRADOR DENTRO DEL CUADRO BLANCO -->
    <div class="admin-section">
        <button class="btn-admin-toggle" onclick="toggleAdminPanel()">🔒 Panel Administrador (Ver Inscritos)</button>
        
        <div class="admin-panel" id="adminPanel">
            <h4 style="color:#3b4e43; margin-bottom:10px;">📋 Registro de Inscritos</h4>
            <div style="overflow-x:auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Casilla</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Regalo</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Se carga automáticamente -->
                    </tbody>
                </table>
            </div>
            <button onclick="downloadCSV()" style="margin-top:12px; background:#4a5d4e; color:white; border:none; padding:10px 15px; border-radius:6px; font-weight:bold; font-size:0.85rem; cursor:pointer;">📥 Descargar Excel / CSV</button>
        </div>
    </div>

</div>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h3>🎉 ¡Inscripción Exitosa!</h3>
        <p id="modalMessage"></p>
        <button onclick="closeModal()">Aceptar</button>
    </div>
</div>

<script>
    const gifts = {
        1: "3 paquetes de toallitas húmedas",
        2: "3 paquetes de toallitas húmedas",
        3: "3 paquetes de toallitas húmedas",
        4: "1 Crema Bálsamo para coceduras",
        5: "1 Crema Bálsamo para coceduras",
        6: "1 Gel Champú de baño bebé",
        7: "1 Gel Champú de baño bebé",
        8: "20 ampollas de suero fisiológico + gasas",
        9: "20 ampollas de suero fisiológico + gasas",
        10: "5 paquetes de discos de algodón",
        11: "5 paquetes de discos de algodón",
        12: "2 chupetes anatómicos para recién nacido",
        13: "2 baberos impermeables",
        14: "1 termómetro digital corporal",
        15: "2 uniset de bodys neutros (0-3 meses)"
    };

    let selectedNum = null;
    let gridState = JSON.parse(localStorage.getItem('bingoGemelosState')) || {};

    function renderGrid() {
        const grid = document.getElementById('bingoGrid');
        grid.innerHTML = '';

        for (let i = 1; i <= 15; i++) {
            const card = document.createElement('div');
            card.className = 'bingo-card';
            const isLocked = !!gridState[i];

            if (isLocked) {
                card.classList.add('locked');
                card.innerHTML = `<div class="num">${i}</div><small style="color:#8c5353;font-weight:bold;">🔒 Reservada</small><small>${gridState[i].name}</small>`;
            } else {
                card.onclick = () => selectCard(i);
                card.innerHTML = `<div class="num">${i}</div><small>Disponible</small>`;
            }

            if (selectedNum === i && !isLocked) card.classList.add('selected');
            grid.appendChild(card);
        }
    }

    function selectCard(num) {
        selectedNum = num;
        document.getElementById('selectedCardText').innerText = `Has seleccionado la Casilla #${num}`;
        document.getElementById('inputName').disabled = false;
        document.getElementById('inputPhone').disabled = false;
        document.getElementById('btnRegister').disabled = false;
        renderGrid();
    }

    function registerCard() {
        const name = document.getElementById('inputName').value.trim();
        const phone = document.getElementById('inputPhone').value.trim();

        if (!name || !phone) {
            alert("Por favor ingresa tu Nombre y Teléfono.");
            return;
        }

        const giftAssigned = gifts[selectedNum] || "Regalo Sorpresa";
        gridState[selectedNum] = { name, phone, gift: giftAssigned };
        localStorage.setItem('bingoGemelosState', JSON.stringify(gridState));

        document.getElementById('modalMessage').innerHTML = `
            Muchas gracias, <strong>${name}</strong>.<br><br>
            Te ha tocado el regalo:<br>
            <strong style="color:#4a5d4e; font-size: 1.1rem;">${giftAssigned}</strong><br><br>
            <em>La casilla #${selectedNum} ha quedado reservada para ti.</em>
        `;
        document.getElementById('modal').classList.add('active');

        document.getElementById('inputName').value = '';
        document.getElementById('inputPhone').value = '';
        document.getElementById('inputName').disabled = true;
        document.getElementById('inputPhone').disabled = true;
        document.getElementById('btnRegister').disabled = true;
        document.getElementById('selectedCardText').innerText = "1. Selecciona un número arriba";
        selectedNum = null;
        renderGrid();
        updateAdminTable();
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
    }

    /* LÓGICA DEL PANEL DE ADMINISTRADOR CON CLAVE 1124 */
    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            const pwd = prompt("Ingresa la clave de administrador:");
            if (pwd === "1124") {
                updateAdminTable();
                panel.style.display = 'block';
            } else if (pwd !== null) {
                alert("Clave incorrecta.");
            }
        }
    }

    function updateAdminTable() {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '';
        let hasData = false;

        for (let i = 1; i <= 15; i++) {
            if (gridState[i]) {
                hasData = true;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${i}</strong></td>
                    <td>${gridState[i].name}</td>
                    <td>${gridState[i].phone}</td>
                    <td>${gridState[i].gift}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        if (!hasData) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">Aún no hay inscritos.</td></tr>`;
        }
    }

    function downloadCSV() {
        let csv = "Casilla,Nombre,Telefono,Regalo\n";
        for (let i = 1; i <= 15; i++) {
            if (gridState[i]) {
                csv += `"#${i}","${gridState[i].name}","${gridState[i].phone}","${gridState[i].gift}"\n`;
            }
        }
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "Inscritos_Bingo_Gemelos.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    renderGrid();
</script>

</body>
</html>
